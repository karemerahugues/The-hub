<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff4d5e;--sun:#ffc93c;--teal:#12b5a6;--plum:#3b2a7a;--sky:#4aa8ff;--bg:#fff8ec;--ink:#241a4a}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--plum),var(--red) 60%,var(--sun))}
.box{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 50px #0004}
.box h1{margin:0 0 4px;font-weight:900;font-size:30px;color:var(--plum)}
.box p{margin:0 0 16px;color:#6a5f8f}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;background:#eee9ff;font-weight:700;cursor:pointer;color:var(--plum)}
.tabs button.on{background:var(--plum);color:#fff}
input{width:100%;padding:12px 14px;margin-bottom:10px;border:2px solid #e3dcff;border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--sky);border-color:var(--sky)}
.go{width:100%;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}
.go:hover{background:#e63a4b}
.msg{min-height:20px;font-size:14px;color:var(--red);font-weight:700;margin-top:8px}
.msg.ok{color:var(--teal)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--plum);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
nav h2{margin:0 0 12px;font-weight:900;font-size:22px}
nav button.t{text-align:left;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:#fff;font-weight:700;cursor:pointer}
nav button.t:hover{background:#ffffff22}
nav button.t.on{background:var(--sun);color:var(--plum)}
nav .me{margin-top:auto;font-size:13px;word-break:break-all;opacity:.85}
nav .out{padding:10px;border:2px solid #fff6;border-radius:12px;background:none;color:#fff;font-weight:700;cursor:pointer}
main{padding:26px;min-width:0}
#chatbox{background:#fff;border-radius:20px;padding:14px;height:calc(100vh - 190px);min-height:300px;overflow-y:auto;border:3px solid var(--sun);display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:16px;background:#eee9ff;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--teal);color:#fff}
.m small{display:block;font-size:11px;opacity:.75;font-weight:700}
.m .x{border:0;background:none;color:inherit;cursor:pointer;margin-left:6px}
#cform{display:flex;gap:8px;margin-top:10px}
#cform input{margin:0}
#cform button{padding:0 22px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}
.panel{background:#fff;border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 4px 14px #3b2a7a18}
.panel h3{margin:0 0 10px;color:var(--plum)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee9ff}
th{background:#eee9ff}
.scroll{max-height:300px;overflow:auto}
.sm{padding:6px 12px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
@media(max-width:700px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav h2,nav .me{display:none}}
</style>
</head>
<body>

<section id="auth">
  <div class="box">
    <h1>The Hub</h1>
    <p>Log in with your email to join the chat.</p>
    <div class="tabs">
      <button id="tLogin" class="on" type="button">Log in</button>
      <button id="tSign" type="button">Sign up</button>
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <button id="authBtn" class="go" type="button">Log in</button>
    <div id="authMsg" class="msg"></div>
  </div>
</section>

<div id="app" class="hide">
  <nav>
    <h2>The Hub</h2>
    <button class="t on" data-v="chat">💬 Chat</button>
    <button class="t" data-v="admin">🔑 Admin</button>
    <div class="me" id="me"></div>
    <button class="out" id="logout" type="button">Log out</button>
  </nav>
  <main>
    <section id="chat" class="view">
      <h1 style="margin:0 0 12px">💬 Chat</h1>
      <div id="chatbox"></div>
      <form id="cform"><input id="ctext" maxlength="500" placeholder="Write a message…" autocomplete="off"><button>Send</button></form>
    </section>

    <section id="admin" class="view hide">
      <h1 style="margin:0 0 12px">🔑 Admin</h1>
      <div id="keyPanel" class="panel hide">
        <h3>Have an access key?</h3>
        <input id="keyIn" placeholder="Enter access key">
        <button class="go" id="keyBtn" type="button">Unlock</button>
        <div id="keyMsg" class="msg"></div>
      </div>
      <div id="staff" class="hide">
        <div class="panel hide" id="adminOnly">
          <h3>Access key (give it to people you trust)</h3>
          <input id="newKey" placeholder="Type a new access key">
          <button class="go" id="setKey" type="button">Save key</button>
          <div id="setMsg" class="msg"></div>
          <h3 style="margin-top:16px">People with access</h3>
          <div id="viewers"></div>
        </div>
        <div class="panel"><h3>Login history (newest first)</h3>
          <div class="scroll"><table><thead><tr><th>Email</th><th>Time</th></tr></thead><tbody id="logs"></tbody></table></div></div>
        <div class="panel"><h3>Registered accounts (<span id="ucount">0</span>)</h3>
          <div class="scroll"><table><thead><tr><th>Email</th><th>Joined</th></tr></thead><tbody id="users"></tbody></table></div></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

/* PASTE YOUR OWN SUPABASE VALUES HERE (Project Settings -> API) */
const sb = createClient("https://ykarherqmencydojtelp.supabase.co", "sb_publishable_QBPkTD7CxuX_GYoeNCykCA_2lRgd1mv");

const $ = id => document.getElementById(id);
let mode = "login", user = null, role = "user", channels = [], seen = new Set();
const isAdmin = () => role === "admin", isStaff = () => role !== "user";
const fmt = t => t ? new Date(t).toLocaleString() : "";

/* ---------- Auth ---------- */
const setMode = m => { mode=m; $("tLogin").classList.toggle("on",m==="login"); $("tSign").classList.toggle("on",m==="sign");
  $("authBtn").textContent = m==="login" ? "Log in" : "Create account"; $("authMsg").textContent=""; };
$("tLogin").onclick=()=>setMode("login"); $("tSign").onclick=()=>setMode("sign");

async function submitAuth(){
  const email=$("email").value.trim().toLowerCase(), password=$("pass").value, msg=$("authMsg");
  msg.className="msg"; msg.textContent="";
  if(!email||password.length<6){msg.textContent="Enter an email and a password of at least 6 characters.";return}
  $("authBtn").disabled=true;
  try{
    let res;
    if(mode==="sign"){
      res = await sb.auth.signUp({email,password});
      if(res.error) throw res.error;
      if(!res.data.session){msg.className="msg ok";msg.textContent="Account created. Check your email to confirm it, then log in.";$("authBtn").disabled=false;return}
    } else {
      res = await sb.auth.signInWithPassword({email,password});
      if(res.error) throw res.error;
    }
    await sb.from("login_events").insert({email:res.data.user.email});   // records who logged in, and when
  }catch(e){
    const m=e.message||"";
    msg.textContent = /invalid login/i.test(m) ? "Wrong email or password."
      : /already registered/i.test(m) ? "That email already has an account. Log in instead."
      : /not confirmed/i.test(m) ? "Confirm your email first. Check your inbox."
      : /rate limit/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : "Something went wrong: "+m;
  }
  $("authBtn").disabled=false;
}
$("authBtn").onclick=submitAuth;
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth()});
$("logout").onclick=()=>sb.auth.signOut();

sb.auth.onAuthStateChange((ev,session)=>{ setTimeout(()=>handleUser(session?session.user:null),0) });

async function handleUser(u){
  if((u&&user&&u.id===user.id)||(!u&&!user)) return;
  channels.forEach(c=>sb.removeChannel(c)); channels=[]; seen.clear(); adminOn=false;
  user=u; role="user";
  $("auth").classList.toggle("hide",!!u); $("app").classList.toggle("hide",!u);
  $("chatbox").innerHTML=""; $("pass").value="";
  if(!u) return;
  $("me").textContent=u.email;
  await refreshRole(); await startChat(); show("chat");
}
async function refreshRole(){
  const {data}=await sb.rpc("my_role"); role=data||"user";
  $("keyPanel").classList.toggle("hide",isStaff());
  $("staff").classList.toggle("hide",!isStaff());
  $("adminOnly").classList.toggle("hide",!isAdmin());
  if(isStaff()) startAdmin();
}

/* ---------- Tabs ---------- */
function show(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("hide",s.id!==v));
  document.querySelectorAll("nav .t").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="chat"){const c=$("chatbox");c.scrollTop=c.scrollHeight}
}
document.querySelectorAll("nav .t").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- Chat ---------- */
function addMsg(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  const d=document.createElement("div"); d.className="m"+(m.user_id===user.id?" me":""); d.id="m-"+m.id;
  const s=document.createElement("small"); s.textContent=m.email+" · "+fmt(m.created_at);
  const t=document.createElement("span"); t.textContent=m.text;   // textContent: safe from HTML injection
  d.append(s,t);
  if(isAdmin()){const x=document.createElement("button");x.className="x";x.textContent="🗑";x.title="Delete message";
    x.onclick=()=>sb.from("messages").delete().eq("id",m.id);d.append(x)}
  const box=$("chatbox"), near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.append(d); if(near||m.user_id===user.id) box.scrollTop=box.scrollHeight;
}
async function startChat(){
  const ch=sb.channel("chat")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>addMsg(p.new))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},p=>{const e=$("m-"+p.old.id);if(e)e.remove()})
    .subscribe();
  channels.push(ch);
  const {data}=await sb.from("messages").select("*").order("id",{ascending:false}).limit(100);
  (data||[]).reverse().forEach(addMsg);
}
$("cform").onsubmit=async e=>{
  e.preventDefault(); const text=$("ctext").value.trim(); if(!text||!user) return;
  $("ctext").value="";
  const {error}=await sb.from("messages").insert({email:user.email,text});
  if(error) alert("Message not sent: "+error.message);
};


$("keyBtn").onclick=async()=>{
  const k=$("keyIn").value.trim(), m=$("keyMsg"); m.className="msg";
  if(!k){m.textContent="Enter the access key.";return}
  const {data}=await sb.rpc("redeem_passkey",{k});
  if(data===true){m.className="msg ok";m.textContent="Unlocked.";await refreshRole()}
  else m.textContent="That key is not correct.";
};
$("setKey").onclick=async()=>{
  const k=$("newKey").value.trim(), m=$("setMsg"); m.className="msg";
  if(k.length<6){m.textContent="Use at least 6 characters.";return}
  const {error}=await sb.rpc("set_passkey",{k});
  if(error){m.textContent="Could not save: "+error.message;return}
  $("newKey").value="";m.className="msg ok";m.textContent="Key saved. Share it only with people you trust.";
};
const row=(vals)=>{const tr=document.createElement("tr");vals.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr};
async function loadAdmin(){
  const [l,p]=await Promise.all([
    sb.from("login_events").select("email,created_at").order("id",{ascending:false}).limit(200),
    sb.from("profiles").select("email,created_at").order("created_at",{ascending:false})]);
  $("logs").replaceChildren(...(l.data||[]).map(r=>row([r.email,fmt(r.created_at)])));
  $("ucount").textContent=(p.data||[]).length;
  $("users").replaceChildren(...(p.data||[]).map(r=>row([r.email,fmt(r.created_at)])));
  if(isAdmin()) loadViewers();
}
async function loadViewers(){
  const {data}=await sb.from("viewers").select("*"), box=$("viewers"); box.replaceChildren();
  if(!data||!data.length){box.textContent="Nobody yet.";return}
  data.forEach(v=>{const r=document.createElement("div");r.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:6px 0";
    const sp=document.createElement("span");sp.textContent=v.email;
    const b=document.createElement("button");b.className="sm";b.textContent="Remove";
    b.onclick=async()=>{await sb.from("viewers").delete().eq("user_id",v.user_id);loadViewers()};
    r.append(sp,b);box.append(r)});
}
let adminOn=false;
function startAdmin(){
  loadAdmin();
  if(adminOn) return; adminOn=true;
  channels.push(sb.channel("logins").on("postgres_changes",{event:"INSERT",schema:"public",table:"login_events"},loadAdmin).subscribe());
}
</script>
</body>
</html>
